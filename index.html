<!DOCTYPE html>
<html>

<head>
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Counter</h1>
        <div class="counter">
            <button id="decrement-btn"><b>-</b></button>
            
            <div id="counter-value">0</div>
            <button id="increment-btn"><b>+</b></button>
            
        </div>
        <button id="reset"><b>reset</b></button>
    </div>

    
    <script src="counter.js"></script>
</body>

</html>
